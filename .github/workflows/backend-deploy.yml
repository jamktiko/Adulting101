name: Deploy Backend to AWS Elastic Beanstalk

# Tämä käynnistyy aina, kun työnnät koodia main-haaraan
on:
  push:
    branches:
      - main # ⚠️ Varmista, että haarasi nimi on main (tai vaihda tähän master)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      # Tässä asennetaan Node.js ympäristö GitHubin virtuaalikoneelle
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.12.0

      # Luodaan puhdas ZIP-paketti täsmälleen samalla komennolla kuin teit manuaalisesti
      - name: Create ZIP package
        run: |
          cd backend
          zip -r ../backend-deploy.zip . -x "*.git*" "*node_modules*" "*dist*" "*.env*"

      # Tämä on varsinainen taikatemppu: valmis Action Beanstalk-julkaisuun
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: Adulting101-backend # ⚠️ VAIHDA: Beanstalk-sovelluksesi nimi
          environment_name: Adulting101-backend-env # ⚠️ VAIHDA: Ympäristösi tarkka nimi (löytyy AWS-konsolista)
          version_label: 'backend-${{ github.sha }}' # Antaa versiolle automaattisesti uniikin ID:n
          region: eu-north-1 # ⚠️ VAIHDA: AWS-alue, jossa EB sijaitsee (esim. eu-central-1, us-east-1)
          deployment_package: backend-deploy.zip
