<div class="category">
  <button class="back-button" routerLink="/topics">Takaisin aiheisiin</button>
  @if (loading()) {
    <p>Ladataan...</p>
  } @else if (content()) {
    <h2>{{ category() }}</h2>
    <div class="items">
      @for (item of content(); track item.id) {
        <div
          class="item"
          [style.background-color]="categoryColor()"
          [style.border]="'2px solid ' + categoryBorderColor()"
        >
          <h3>{{ item.title }}</h3>
          <ul>
            @for (line of item.items || item.content; track line) {
              <li>{{ line }}</li>
            }
          </ul>
        </div>
      }
    </div>
  }
</div>
