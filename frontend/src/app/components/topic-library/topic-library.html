<div class="note-grid">
  <!-- Muistilaput eri väreillä ja otsikoilla, klikkauksella navigointi eri kategorioihin -->
  @for (note of topicNotes; track $index) {
    <app-post-it-note
      [title]="note.title"
      [color]="note.color"
      [route]="note.route"
      (noteClick)="handleNoteClick(note)"
    />
  }
</div>
